name: mummymap
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  shared_preferences: ^2.2.3
  dio: ^5.9.2
  flutter_secure_storage: ^8.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"


  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/firstlogo.png
    - assets/logo2.png
    - assets/Frame 75.png
    - assets/Frame 76.png
    - assets/Frame 77.png
    - assets/logo3.png
    - assets/mum2.jpg
   