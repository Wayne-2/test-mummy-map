name: mummymap
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  shared_preferences: ^2.2.3
  dio: ^5.9.2
  flutter_secure_storage: 
  image_picker: ^1.2.2
  share_plus: ^13.1.0
  flutter_widget_from_html_core: ^0.17.2
  go_router: ^17.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6
  agora_rtc_engine: ^6.5.3
  permission_handler: ^12.0.1
  firebase_core: ^4.11.0
  onesignal_flutter: ^5.6.3
  add_2_calendar: 3.0.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  webview_flutter: ^4.14.1
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"


  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/firstlogo.png
    - assets/logo2.png
    - assets/Frame 75.png
    - assets/Frame 76.png
    - assets/Frame 77.png
    - assets/logo3.png
    - assets/mum2.jpg
   